status:
  scope: >-
    The selected declaration RerandomizedSTT.problem_5_6 concerns independent
    fair sign assignments, uniform distinct-row sampling, real Walsh matrices
    of order 2^k, all orthonormal real d-frames with 1 <= d <= 2^k,
    0 < epsilon < 1, and 0 < delta < 1/2. It includes the explicit prescribed
    row count, positivity, the ambient cap, the dimension-linear bound with
    its displayed dependence on delta, and the simultaneous norm guarantee.
    The full proof library also contains limited-independence, Bernoulli
    moment, cubic-logarithmic confidence, and support-obstruction theorems;
    these are documented in notes/REPORT_COVERAGE.md and audited in Audit.lean,
    but are not separately selected claims in this Comparator configuration.
    Complex Fourier/DCT models, arbitrary non-Walsh sizes, optimized constants,
    executable transform complexity, novelty, and a universal Gaussian
    confidence bound are not asserted by the selected declaration.
  # Deliberate Challenge theorem holes specify the statement to be compared.
  # These counts concern Solution and the substantive proof sources only.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

