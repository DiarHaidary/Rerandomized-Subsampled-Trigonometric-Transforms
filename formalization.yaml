fidelity:
  divergences: >-
    The selected theorem uses the transpose of the source's sketching matrix,
    with the same squared-norm event, and makes distinct-row sampling and
    finite independence explicit. Walsh order n=2^k is part of the formal
    model. The big-O claim is replaced by an explicit row prescription and
    a dimension-linear bound whose constant depends on delta. At fixed delta
    this is the requested dimension order; it must not be read as a constant
    uniform over all confidence levels. The full project report has additional
    conclusions outside the single Comparator claim. See notes/SOURCE_FIDELITY.md.

